<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:#fff;
            width:380px;
            padding:35px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            color:#333;
            margin-bottom:20px;
        }

        .message{
            background:#f8f9fa;
            color:#d9534f;
            border-left:4px solid #d9534f;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:16px;
            margin-bottom:20px;
            transition:0.3s;
        }

        input:focus{
            border-color:#4facfe;
            box-shadow:0 0 8px rgba(79,172,254,0.3);
        }

        button{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2b8ef9;
        }

        @media(max-width:420px){
            .container{
                width:90%;
                padding:25px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Verify OTP</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="otp"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                required
            >

            <button type="submit">
                Verify OTP
            </button>
        </form>

    </div>

</body>
</html>
