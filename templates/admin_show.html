{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style2.css' %}" />
  </head>
  <style>
    .box3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn4 {
      padding: 10px;
      margin-right: 50px;
      width: 100px;
      font-size: 17px;
      font-weight: bolder;
      border-radius: 10px;
      border: none;
      background-color: red;
    }
    a {
      text-decoration: none;
      color: white;
    }
  </style>
  <body>
    <header>
      <h1 class="hed">Products <span>.</span></h1>
      <button class="btn1"><span class="stn">+</span><a href="add_products">Add New Products</a></button>
    </header>

    <main>
      <section>
        <div class="main">
          <div class="box">
            <div class="box3">
              <H1 class="hed2">All Products</H1>
              <button class="btn4"><a href="{% url 'logout' %}">Logout</a></button>
            </div>

            <nav>
              <H2>ID</H2>
              <H2>Imge</H2>
              <h2>Product Name</h2>
              <H2>Price</H2>
              <H2>Discount</H2>
              <H2>Final Price</H2>
              <H2>Quantiy</H2>
              <H2>Action</H2>
            </nav>
          </div>

          <div class="item">
            {% for x in data %}
              <div class="box2">
                <h3>{{ forloop.counter }}</h3>
                <img src="{{ x.imge.url }}" alt="" height="100" />
                <h4>{{ x.Flower }}</h4>
                <h4>{{ x.rate }}</h4>
                <h4>%{{ x.discount }}</h4>
                <h4>{{ x.final_price }}</h4>

                <h4>{{ x.qut }}</h4>
                <div class="action">
                  <a href="{% url 'edit_product' x.id %}" class="edit-btn">Edit</a>
                  <a href="{% url 'delete_product' x.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                </div>
              </div>
            {% endfor %}
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
