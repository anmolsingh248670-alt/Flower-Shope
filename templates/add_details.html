{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "add_details.css" %}">
</head>
<body>
    <form method="POST">
    {% csrf_token %}

    <label>Product</label>
    <select name="detales">
        {% for product in products %}
            <option value="{{ product.id }}">{{ product.Flower }}</option>
        {% endfor %}
    </select>

    <label>Header</label>
    <input type="text" name="header">

    <label>Color</label>
    <input type="text" name="Color">

    <label>Description</label>
    <textarea name="text"></textarea>

    <label>Date</label>
    <input type="date" name="date">

    <button type="submit">Save</button>
</form>
    
</body>
</html>
