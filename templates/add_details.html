
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product Details</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'add_details.css' %}">
</head>

<body>

    <div class="page-container">

        <div class="form-box">

            <div class="form-header">
                <div class="icon-box">🌸</div>

                <h2>Add Product Details</h2>

                <p>Enter product information below</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="detales">Select Product</label>

                    <select name="detales" id="detales" required>
                        <option value="">Choose a product</option>

                        {% for product in products %}
                            <option value="{{ product.id }}">
                                {{ product.Flower }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="header">Header</label>

                    <input
                        type="text"
                        name="header"
                        id="header"
                        placeholder="Enter product header"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="Color">Color</label>

                    <input
                        type="text"
                        name="Color"
                        id="Color"
                        placeholder="Enter product color"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="text">Description</label>

                    <textarea
                        name="text"
                        id="text"
                        placeholder="Write product description..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        type="date"
                        name="date"
                        id="date"
                    >
                </div>

                <button type="submit" class="save-btn">
                    Save Product Details
                    <span>→</span>
                </button>
                <button class="save-btn"><a class="save12" href="{% url 'admin_orders' %}">Back 
                    <span><i class="fa-solid fa-arrow-left-long"></i></span>
                    </a>
                     </button>

            </form>

            <div class="form-footer">
                <p>Flower Shop Admin Panel 🌷</p>
            </div>

        </div>

    </div>

</body>
</html>
