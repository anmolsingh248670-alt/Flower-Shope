
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed | Flower Store</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f2f5;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            color: #e84393;
        }

        p {
            color: #777;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #ff4785;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🌸 Password Changed!</h1>

    <p>
        Your password has been successfully updated.
        You can now log in using your new password.
    </p>

    <a href="{% url 'home_login' %}">Login Now</a>

</div>

</body>
</html>
